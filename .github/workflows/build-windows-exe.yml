name: Build XBRL AI Agent Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: XBRL_AI_Agent_Windows
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore XBRLAIAgent.csproj

      - name: Publish self-contained single EXE
        run: >
          dotnet publish XBRLAIAgent.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'XBRL_AI_Agent_WindowspublishXBRLAIAgent.exe'
          if (!(Test-Path $exe)) { throw "EXE was not created: $exe" }
          Write-Host "Created: $exe"
          Write-Host "Size: $((Get-Item $exe).Length) bytes"

      - name: Package release ZIP
        shell: pwsh
        run: Compress-Archive -Path 'publishXBRLAIAgent.exe' -DestinationPath 'XBRL-AI-Agent-Windows-x64.zip' -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: XBRL-AI-Agent-Windows-x64
          path: XBRL_AI_Agent_Windows/publish/XBRLAIAgent.exe
          if-no-files-found: error

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: XBRL-AI-Agent-Windows-x64-ZIP
          path: XBRL_AI_Agent_Windows/XBRL-AI-Agent-Windows-x64.zip
          if-no-files-found: error
